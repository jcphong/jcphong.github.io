<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>jcphong</title>
  <meta name="description" content="GitHub profile and projects of jcphong">
  <style>
    :root {
      --bg: #f6f8fa; --card: #ffffff; --text: #1f2328; --muted: #59636e;
      --border: #d1d9e0; --accent: #0969da;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #0d1117; --card: #151b23; --text: #e6edf3; --muted: #9198a1;
        --border: #3d444d; --accent: #4493f8;
      }
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; background: var(--bg); color: var(--text);
      font: 16px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
    }
    a { color: var(--accent); text-decoration: none; }
    a:hover { text-decoration: underline; }
    main { max-width: 960px; margin: 0 auto; padding: 48px 16px; }
    header { display: flex; gap: 24px; align-items: center; flex-wrap: wrap; margin-bottom: 40px; }
    header img { width: 120px; height: 120px; border-radius: 50%; border: 1px solid var(--border); }
    h1 { margin: 0; font-size: 2rem; }
    .login { color: var(--muted); font-size: 1.15rem; }
    .bio { margin: 8px 0; }
    .meta { display: flex; gap: 16px; flex-wrap: wrap; color: var(--muted); font-size: .9rem; }
    h2 { font-size: 1.25rem; border-bottom: 1px solid var(--border); padding-bottom: 8px; }
    .grid { display: grid; gap: 16px; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); }
    .repo {
      background: var(--card); border: 1px solid var(--border); border-radius: 8px;
      padding: 16px; display: flex; flex-direction: column; gap: 8px;
    }
    .repo h3 { margin: 0; font-size: 1rem; word-break: break-word; }
    .repo p { margin: 0; color: var(--muted); font-size: .9rem; flex: 1; }
    .repo .stats { display: flex; gap: 16px; color: var(--muted); font-size: .8rem; }
    .status { color: var(--muted); }
    footer { margin-top: 48px; color: var(--muted); font-size: .85rem; text-align: center; }
  </style>
</head>
<body>
  <main>
    <header id="profile"><p class="status">Loading profile…</p></header>
    <section>
      <h2>Repositories</h2>
      <div id="repos" class="grid"><p class="status">Loading repositories…</p></div>
    </section>
    <footer>Data loaded live from the GitHub API.</footer>
  </main>

  <script>
    const USER = "jcphong";
    const esc = s => String(s ?? "").replace(/[&<>"']/g, c =>
      ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

    async function load() {
      const profileEl = document.getElementById("profile");
      const reposEl = document.getElementById("repos");
      try {
        const [user, repos] = await Promise.all([
          fetch(`https://api.github.com/users/${USER}`).then(r => r.ok ? r.json() : Promise.reject(r.status)),
          fetch(`https://api.github.com/users/${USER}/repos?per_page=100&sort=updated`).then(r => r.ok ? r.json() : Promise.reject(r.status)),
        ]);

        document.title = user.name || user.login;
        const blog = user.blog && (/^https?:\/\//.test(user.blog) ? user.blog : `https://${user.blog}`);
        profileEl.innerHTML = `
          <img src="${esc(user.avatar_url)}" alt="${esc(user.login)} avatar">
          <div>
            <h1>${esc(user.name || user.login)}</h1>
            <div class="login"><a href="${esc(user.html_url)}">@${esc(user.login)}</a></div>
            ${user.bio ? `<p class="bio">${esc(user.bio)}</p>` : ""}
            <div class="meta">
              ${user.location ? `<span>📍 ${esc(user.location)}</span>` : ""}
              ${user.company ? `<span>🏢 ${esc(user.company)}</span>` : ""}
              ${blog ? `<span>🔗 <a href="${esc(blog)}">${esc(user.blog)}</a></span>` : ""}
              <span>👥 ${user.followers} followers · ${user.following} following</span>
              <span>📦 ${user.public_repos} public repos</span>
            </div>
          </div>`;

        const list = repos.filter(r => !r.fork);
        reposEl.innerHTML = list.length ? list.map(r => `
          <article class="repo">
            <h3><a href="${esc(r.html_url)}">${esc(r.name)}</a></h3>
            <p>${esc(r.description || "No description")}</p>
            <div class="stats">
              ${r.language ? `<span>${esc(r.language)}</span>` : ""}
              <span>★ ${r.stargazers_count}</span>
              <span>⑂ ${r.forks_count}</span>
              <span>Updated ${new Date(r.pushed_at).toLocaleDateString()}</span>
            </div>
          </article>`).join("") : `<p class="status">No public repositories yet.</p>`;
      } catch (e) {
        profileEl.innerHTML = `<h1>${USER}</h1><p class="status">Couldn't load profile (${esc(e)}). <a href="https://github.com/${USER}">View on GitHub</a>.</p>`;
        reposEl.innerHTML = "";
      }
    }
    load();
  </script>
</body>
</html>
